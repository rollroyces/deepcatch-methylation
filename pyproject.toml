[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcatch-methylation"
version = "0.10.0"
description = "Real-time cfRNA read-side companion to mrnavax-rare — observes plasma cfRNA persistence and lifts it into a real-time chronic-disease-management feature schema."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Royce" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepcatch_methylation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
