[project]
name = "deepcatch-methylation"
version = "0.0.1"
description = "CpG methylation-based cfDNA cancer detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    {name = "Yu Ching Lam", email = "rollroyces@users.noreply.github.com"},
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
finaleme = [
    "FinaleToolkit>=1.1",
    "pysam>=0.22",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
